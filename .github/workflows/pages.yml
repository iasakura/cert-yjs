# Pages: build the demo of yjswasm/ and publish it on GitHub Pages.
#
# The demo is one page on which Yjs and Cert-Yjs (the Go CRDT of yjs/,
# compiled to WebAssembly) edit one text together. Every push that touches
# the Go or the demo builds the WebAssembly module and runs the binding's
# tests against the yjs npm package; a push to main also publishes the page.
# The page loads Yjs itself from jsDelivr at the version the tests use
# (yjswasm/package-lock.json).
#
# Supply-chain policy: as in ci.yml, official GitHub actions only, each pinned
# by commit SHA, the vX.Y.Z comments being notes for humans.

name: Pages

on:
  push:
    paths:
      - 'yjs/**'
      - 'yjswasm/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. A newer push cancels a run on any branch but
# main, where a deployment that has started is left to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.0'

      - name: Build the WebAssembly module
        run: ./yjswasm/build.sh

      - name: Test the binding against Yjs
        working-directory: yjswasm
        run: |
          npm ci
          npm test

      - name: Collect the page
        run: |
          mkdir _site
          cp yjswasm/index.html yjswasm/demo.mjs yjswasm/cert-yjs.mjs \
             yjswasm/cert-yjs.wasm yjswasm/wasm_exec.js _site/

      - name: Upload the page
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
