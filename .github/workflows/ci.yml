# CI: go build → goose translation → rocq compile (proof check)
#
# Supply-chain policy:
#   - Official GitHub actions (actions/*) only; no third-party actions.
#   - Everything is pinned by commit SHA (tags can be moved, SHAs cannot).
#     The vX.Y.Z comments are notes for humans. To update, resolve the new
#     tag to its commit SHA:
#       git ls-remote https://github.com/actions/checkout 'refs/tags/vX.Y.Z^{}'
#   - opam dependencies are all pinned to git SHAs via pin-depends in
#     cert-yjs.opam.
#   - goose's source (built by --local) comes from the perennial that opam
#     installed into the switch, so cert-yjs.opam's pin is the ONLY place a
#     perennial version is named and goose cannot drift from the library. That
#     pin is the fork iasakura/perennial at a43a6150 = upstream mit-pdos
#     f884a505d plus two goose-only patches (ffiMapping entries routing the
#     grovenet package to the grove FFI, issue #45, and the wsnet package to
#     the ws FFI). Drop the fork once goose learns a per-project ffi mapping.
#     build.sh refuses to translate against a goose missing those entries.
#
# Caching the opam switch:
#   - The cache holds ~/.opam and the local switch _opam (~800 MB). Building it
#     from scratch takes ~50 min (perennial alone is ~35 min), so a run that
#     restores it goes straight to goose + proof checking.
#   - The key carries the run id, and the restore falls back to the newest
#     entry built from the same cert-yjs.opam. A fixed key can never be
#     rewritten once taken, so a single bad entry would be pinned to it
#     forever; with the run id, every save publishes a new entry that later
#     runs prefer.
#   - The save runs only when opam actually installed something AND the step
#     ran to completion, so an interrupted run never publishes a switch with no
#     packages in it. That is exactly what broke on 2026-08-20: a push cancelled
#     a run 143s into the install (see concurrency below), its always()-guarded
#     save wrote a 145 MB empty switch under the fixed key, and for the next two
#     weeks every run restored that and reinstalled all 26 packages, adding
#     ~50 min to each.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.0'

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam

      - name: Restore opam cache
        id: opam-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('cert-yjs.opam') }}-${{ github.run_id }}
          restore-keys: |
            opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('cert-yjs.opam') }}-

      - name: Set up opam switch (slow on cache miss)
        id: opam-switch
        run: |
          if [ ! -d "$HOME/.opam" ]; then
            opam init --bare --disable-sandboxing -y
          fi
          if [ ! -d _opam ]; then
            opam switch create . ocaml-base-compiler.5.2.0 --no-install -y
          fi
          # Whether the restored switch was already complete, decided by what
          # opam did rather than by a version-specific "Nothing to do." string.
          opam list --installed --short > /tmp/opam-installed-before.txt
          opam install ./cert-yjs.opam --deps-only -y
          opam list --installed --short > /tmp/opam-installed-after.txt
          if cmp -s /tmp/opam-installed-before.txt /tmp/opam-installed-after.txt; then
            echo "switch-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "switch-changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No always(): a cancelled or failed install must not publish its
      # half-built switch. Nothing to save when the restore was already
      # complete, either.
      - name: Save opam cache
        if: steps.opam-switch.outputs.switch-changed == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('cert-yjs.opam') }}-${{ github.run_id }}

      - name: Build (go build → goose → proof check)
        # goose comes from _opam/.opam-switch/sources/perennial, the pinned
        # source opam kept after installing it
        run: opam exec -- ./build.sh
