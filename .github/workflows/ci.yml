# CI: go build → goose translation → rocq compile (proof check)
#
# Supply-chain policy:
#   - Official GitHub actions (actions/*) only; no third-party actions.
#   - Everything is pinned by commit SHA (tags can be moved, SHAs cannot).
#     The vX.Y.Z comments are notes for humans. To update, resolve the new
#     tag to its commit SHA:
#       git ls-remote https://github.com/actions/checkout 'refs/tags/vX.Y.Z^{}'
#   - opam dependencies are all pinned to git SHAs via pin-depends in
#     cert-yjs.opam.
#   - The perennial checkout supplies goose's source (built by --local). It is
#     fetched from the fork iasakura/perennial at grove-new-wp, which is the
#     opam-pinned perennial commit plus one goose-only patch: an ffiMapping
#     entry routing the grovenet package to the grove FFI (issue #45). The
#     patch touches only goose/util/util.go — no .v file — so the Perennial
#     Rocq library the opam pin builds is unchanged; hence the opam pin stays
#     on upstream mit-pdos and only this goose checkout carries the patch.
#
# The first run (no cache) builds Perennial and takes a few hours. Later runs
# hit the _opam cache and only do goose + proof checking.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # goose source for --local: the opam-pinned perennial commit
  # (f884a505d..., cert-yjs.opam) plus the grovenet ffiMapping patch (#45),
  # i.e. the tip of iasakura/perennial's grove-new-wp branch.
  PERENNIAL_REPO: https://github.com/iasakura/perennial
  PERENNIAL_COMMIT: e8af799716f3b8963a61975b9e6652f1192f49cb

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.0'

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam

      - name: Restore opam cache
        id: opam-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('cert-yjs.opam') }}

      - name: Set up opam switch (slow on cache miss)
        run: |
          if [ ! -d "$HOME/.opam" ]; then
            opam init --bare --disable-sandboxing -y
          fi
          if [ ! -d _opam ]; then
            opam switch create . ocaml-base-compiler.5.2.0 --no-install -y
          fi
          opam install ./cert-yjs.opam --deps-only -y

      # Save even on failure so the multi-hour first build can resume next run
      - name: Save opam cache
        if: always() && steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('cert-yjs.opam') }}

      - name: Fetch perennial (goose source; opam-pin commit + grovenet ffiMapping patch)
        run: |
          git init "$HOME/perennial"
          git -C "$HOME/perennial" remote add origin "$PERENNIAL_REPO"
          git -C "$HOME/perennial" fetch --depth 1 origin "$PERENNIAL_COMMIT"
          git -C "$HOME/perennial" checkout FETCH_HEAD

      - name: Build (go build → goose → proof check)
        run: opam exec -- env PERENNIAL="$HOME/perennial" ./build.sh
