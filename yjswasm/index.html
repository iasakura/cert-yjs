<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cert-Yjs in the browser</title>
<style>
  :root {
    --background: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a65;
    --border: #d9d6cc;
    --accent: #1f6f5c;
    --warning: #a4541a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #17181a;
      --surface: #212325;
      --text: #e9e7e1;
      --muted: #9b998f;
      --border: #383b3e;
      --accent: #6fcfb6;
      --warning: #e7a36a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 48px;
    background: var(--background);
    color: var(--text);
    font: 15px/1.5 system-ui, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); max-width: 70ch; }
  .network {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    margin: 20px 0 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .network label { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .network input { width: 18px; height: 18px; accent-color: var(--accent); }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; }
  #status.diverged { color: var(--warning); }
  .replicas { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .replica {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    min-width: 0;
  }
  .replica h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .replica h2 span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  textarea {
    display: block;
    width: 100%;
    height: 180px;
    resize: vertical;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--background);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .delta {
    margin: 10px 0 0;
    min-height: 3.2em;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .delta b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Cert-Yjs in the browser</h1>
  <p>
    Two replicas of one text, each a document of the Go CRDT compiled to
    WebAssembly, driven through a Yjs-shaped API. Type in either box. To see
    a merge, switch the network off, edit both sides, and switch it back on.
  </p>

  <div class="network">
    <label><input type="checkbox" id="connected" checked> Network connected</label>
    <span id="status">loading the wasm module</span>
  </div>

  <div class="replicas">
    <section class="replica">
      <h2>Alice <span id="alice-size"></span></h2>
      <textarea id="alice-text" spellcheck="false" disabled></textarea>
      <div class="delta" id="alice-delta"></div>
    </section>
    <section class="replica">
      <h2>Bob <span id="bob-size"></span></h2>
      <textarea id="bob-text" spellcheck="false" disabled></textarea>
      <div class="delta" id="bob-delta"></div>
    </section>
  </div>
</main>

<script type="module">
import * as Y from './cert-yjs.mjs'

const element = (id) => document.getElementById(id)

// positionAfter moves a caret position in the old text through delta.
const positionAfter = (delta, position) => {
  let index = 0
  let shift = 0
  for (const operation of delta) {
    if (index >= position) {
      break
    }
    if (operation.retain !== undefined) {
      index += operation.retain
    } else if (operation.insert !== undefined) {
      shift += operation.insert.length
    } else {
      shift -= Math.min(operation.delete, position - index)
      index += operation.delete
    }
  }
  return position + shift
}

// bindTextarea keeps textarea and text equal: an edit of the textarea becomes
// one delete and one insert in a transaction, a change of the text (local or
// remote) is written back with the caret moved through its delta.
const bindTextarea = (textarea, text, deltaLog) => {
  textarea.value = text.toString()

  const pushEdit = () => {
    const before = text.toString()
    const after = textarea.value
    let prefix = 0
    while (prefix < before.length && prefix < after.length && before[prefix] === after[prefix]) {
      prefix++
    }
    let suffix = 0
    while (suffix < before.length - prefix && suffix < after.length - prefix &&
           before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) {
      suffix++
    }
    text.doc.transact(() => {
      text.delete(prefix, before.length - prefix - suffix)
      text.insert(prefix, after.slice(prefix, after.length - suffix))
    }, textarea)
    if (textarea.value !== after) {
      const caret = textarea.selectionStart
      textarea.value = after
      textarea.setSelectionRange(caret, caret)
    }
  }
  textarea.addEventListener('input', (event) => {
    // An input method's composition is pushed once, when it ends.
    if (!event.isComposing) {
      pushEdit()
    }
  })
  textarea.addEventListener('compositionend', pushEdit)

  text.observe((event) => {
    const origin = event.transaction.origin === textarea ? 'local' : 'remote'
    deltaLog.innerHTML = `<b>last ${origin} delta</b> `
    deltaLog.append(JSON.stringify(event.delta))
    const next = text.toString()
    if (textarea.value !== next) {
      const start = positionAfter(event.delta, textarea.selectionStart)
      const end = positionAfter(event.delta, textarea.selectionEnd)
      textarea.value = next
      textarea.setSelectionRange(start, end)
    }
  })
}

await Y.init()

const replicas = ['alice', 'bob'].map((name, index) => {
  const doc = new Y.Doc({ clientID: index + 1 })
  return { name, doc, text: doc.getText('note'), outbox: null }
})
const connected = element('connected')

const render = () => {
  const [alice, bob] = replicas
  for (const replica of replicas) {
    element(`${replica.name}-size`).textContent =
      `${replica.text.length} chars, ${Y.encodeStateAsUpdate(replica.doc).length} bytes of state`
  }
  const status = element('status')
  const agree = alice.text.toString() === bob.text.toString()
  status.className = agree ? '' : 'diverged'
  status.textContent = agree
    ? 'The replicas agree.'
    : connected.checked ? 'The replicas differ.' : 'Offline: the replicas differ until the network is back.'
}

// The network: every update of one replica goes to the other, at once when
// connected. Offline only the latest is kept, an update being the whole state.
const deliver = () => {
  for (const replica of replicas) {
    const peer = replicas.find((other) => other !== replica)
    if (replica.outbox !== null) {
      const update = replica.outbox
      replica.outbox = null
      Y.applyUpdate(peer.doc, update, 'network')
    }
  }
}
for (const replica of replicas) {
  replica.doc.on('update', (update, origin) => {
    if (origin !== 'network') {
      replica.outbox = update
      if (connected.checked) {
        deliver()
      }
    }
    render()
  })
  const textarea = element(`${replica.name}-text`)
  bindTextarea(textarea, replica.text, element(`${replica.name}-delta`))
  textarea.disabled = false
}
connected.addEventListener('change', () => {
  if (connected.checked) {
    deliver()
  }
  render()
})

replicas[0].doc.transact(() => replicas[0].text.insert(0, 'Hello from the verified core.'), element('alice-text'))
render()
</script>
</body>
</html>
